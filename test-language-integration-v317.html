<!doctype html><html><body><pre id="out">RUNNING</pre><script>
(async()=>{
 const out=[];
 function wait(ms){return new Promise(r=>setTimeout(r,ms));}
 async function load(path){return new Promise((resolve,reject)=>{const f=document.createElement('iframe');f.style.display='none';f.onload=()=>resolve(f);f.onerror=reject;f.src=path;document.body.appendChild(f);});}
 function change(doc,id,value){const el=doc.getElementById(id); if(!el) throw new Error('missing '+id); el.value=value; el.dispatchEvent(new Event('change',{bubbles:true}));}
 function text(doc,id){return doc.getElementById(id).textContent.trim();}
 try{
  let f=await load('tests/rendered-ypologismos-morion-1ea-2025-v317.html'); let d=f.contentDocument;
  change(d,'langName1','en'); change(d,'lang1','4'); change(d,'langName2','en'); change(d,'lang2','8'); await wait(50);
  out.push(text(d,'academicSubtotal')==='8,00'?'PASS 1EA duplicate highest':'FAIL 1EA '+text(d,'academicSubtotal')); f.remove();

  f=await load('tests/rendered-ypologismos-morion-2ea-2025-v317.html'); d=f.contentDocument;
  change(d,'langName1','fr'); change(d,'lang1','3'); change(d,'langName2','fr'); change(d,'lang2','7'); await wait(50);
  out.push(text(d,'academicSubtotal')==='7,00'?'PASS 2EA duplicate highest':'FAIL 2EA '+text(d,'academicSubtotal')); f.remove();

  f=await load('tests/rendered-ypologismos-morion-3ea-2025-v317.html'); d=f.contentDocument;
  change(d,'specialty','ΠΕ06'); change(d,'langName1','en'); change(d,'lang1','7'); change(d,'langName2','fr'); change(d,'lang2','5'); await wait(50);
  out.push(text(d,'resAcademic').startsWith('5.00')?'PASS 3EA PE06 English excluded':'FAIL 3EA '+text(d,'resAcademic')); f.remove();

  f=await load('tests/rendered-ypologismos-morion-apospasis-dimos-v317.html'); d=f.contentDocument;
  change(d,'appointmentLanguage','en'); change(d,'languageName1','en'); change(d,'language1','3'); change(d,'languageName2','fr'); change(d,'language2','2'); await wait(50);
  out.push(text(d,'languageSubtotal').startsWith('2.00')?'PASS DIMOS appointment language excluded':'FAIL DIMOS '+text(d,'languageSubtotal')); f.remove();

  document.getElementById('out').textContent=out.join('\n')+'\n'+(out.every(x=>x.startsWith('PASS'))?'ALL PASS':'HAS FAIL');
 }catch(e){document.getElementById('out').textContent='ERROR '+e.stack;}
})();
</script></body></html>
